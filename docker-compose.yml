services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: finance_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./finance-dashboard

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mysql://mysql:3306/finance_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      SERVER_PORT: 8082

    ports:
      - "8082:8082"

  frontend:
    build:
      context: ./finance-ui

      args:
        VITE_API_BASE_URL: http://localhost:8082

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "5500:80"

volumes:
  mysql_data:
